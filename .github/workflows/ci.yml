name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step runs one arm of scripts/gate.py. The commands live there, not
# here: a local `python scripts/gate.py <arm>` is byte-for-byte what CI runs.
# The `fast` arm is the local default only; CI runs `tests`, which covers it.
jobs:
  checks:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # One environment for the whole job: the test, docs, and catalog arms.
      - name: Install gate dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Syntax
        run: python scripts/gate.py syntax
      - name: Docs, links, and generated facts
        run: python scripts/gate.py docs
      - name: Unit tests
        run: python scripts/gate.py tests
      - name: Verify model IDs against the OpenRouter catalog
        run: python scripts/gate.py models

  # Pin: .github/gnn-pin.json — see .github/GNN.md. The arm installs the pinned
  # parser revision and verifies it (scripts/check_gnn_conformance.py).
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pinned GNN parser and repository sketches
        run: python scripts/gate.py gnn
