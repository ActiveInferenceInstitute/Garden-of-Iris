name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Markdown link and anchor check
        run: python scripts/check_markdown_links.py
      - name: Install test dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Verify model IDs against the OpenRouter catalog
        run: python scripts/check_openrouter_models.py
