name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Markdown link and anchor check
        run: python scripts/check_markdown_links.py
      - name: Install test dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Verify model IDs against the OpenRouter catalog
        run: python scripts/check_openrouter_models.py
