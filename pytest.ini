[pytest]
# The gate's `fast` arm selects `-m "not network"`; see scripts/gate.py.
# The suite is offline today: no test carries this marker, and the live
# OpenRouter catalog check lives in scripts/check_openrouter_models.py, not here.
# `gnn_resources` tests run only under `--gnn-admission` (the `admission` arm);
# see tests/conftest.py.
markers =
    network: test requires external network access; excluded from the fast gate arm
    gnn_resources: test requires the reviewed GNN_* inputs; selected only by --gnn-admission
