- documentation
- tested
- ci
- citation
tasks:
  syntax:
    cmd: python scripts/gate.py syntax
    description: Compile every Python module.
  docs:
    cmd: python scripts/gate.py docs
    description: "Check links, index coverage, publishing digests and generated facts. Docs index: docs/documentation-index.md. Manuscript command: none."
  fast:
    cmd: python scripts/gate.py fast
    description: Run the default offline unit suite.
  tests:
    cmd: python scripts/gate.py tests
    description: Run the whole Python test suite.
  models:
    cmd: python scripts/gate.py models
    description: Check model IDs against the live OpenRouter catalog (network).
  gnn:
    cmd: python scripts/gate.py gnn
    description: "Run pinned GNN conformance (network, Python 3.12). Pin: .github/gnn-pin.json."
docs:
- README.md
- AGENTS.md
- .aii/docs/INTEGRATION.md
- docs/README.md
