# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.2
  updated: '2026-11-16'
repo:
  name: Garden-of-Iris
  slug: garden-of-iris
  full_name: ActiveInferenceInstitute/Garden-of-Iris
  description: 'Experimental Iris collective-intelligence toolkit: Discord bot, hindsight
    summarization, FourThought parsing, and data tooling.'
  default_branch: master
institute:
  category: research
  maturity: wip
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    relation: references
    note: References GNN and checks its pinned upstream exemplar; no authored generative model is declared.
  links:
    github: https://github.com/ActiveInferenceInstitute/Garden-of-Iris
    website: https://www.activeinference.org
artifacts:
- path: .
  description: Repository root.
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: tests
  kind: test
  description: Test suite.
- path: docs
  kind: doc
  description: Documentation tree.
- path: docs/documentation-index.md
  kind: doc
  description: Repository documentation index.
- path: docs/workflows/publishing.md
  kind: doc
  description: Publishing artifact identity and adapter contract.
provenance:
  license: CC-BY-4.0
  citation:
    text: Active Inference Institute — Garden-of-Iris.
instituteos:
  tags:
  - garden-of-iris
  - collective-intelligence
  - language-model
  - pipeline
capabilities:
- documentation
- tested
- ci
- citation
tasks:
  syntax:
    cmd: python scripts/gate.py syntax
    description: Compile authored Python, excluding environments and caches.
  docs:
    cmd: python scripts/gate.py docs
    description: 'Check links, index coverage, publishing digests and generated facts.
      Docs index: docs/documentation-index.md. Manuscript command: none.'
  fast:
    cmd: python scripts/gate.py fast
    description: Run the default offline unit suite.
  tests:
    cmd: python scripts/gate.py tests
    description: Run the whole Python test suite.
  models:
    cmd: python scripts/gate.py models
    description: Check model IDs against the live OpenRouter catalog (network).
  gnn:
    cmd: python scripts/gate.py gnn
    description: 'Run pinned GNN conformance (network, Python 3.12). Pin: .github/gnn-pin.json.'
docs:
- README.md
- AGENTS.md
- docs/INTEGRATION.md
- docs/README.md
- AGENTS.md
- docs/AGENTS.md
schema: aii-sidecar/v1
