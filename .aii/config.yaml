  description: Repository root.
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: tests
  kind: test
  description: Test suite.
- path: docs
  kind: doc
  description: Documentation tree.
